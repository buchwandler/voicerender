name: Run tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install -e ".[dev]"
          python -m compileall -q voicerender tests
      - name: Run tests
        run: python -m pytest -q --full-trace

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install -e ".[dev]"
      - name: Run quality checks
        run: |
          ruff check .
          ruff format --check .
          mypy --strict voicerender
          python -m compileall -q voicerender

  engine-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [kokoro, piper, pocket, kitten, sopro, supertonic, inflect]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine extra and test tools
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install -e ".[${{ matrix.extra }}]" pytest
      - name: Run API and adapter contracts without model downloads
        run: python -m pytest -q tests/test_engine_registry.py tests/test_backends.py

  sopro-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Sopro extra and test tools
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install -e ".[sopro]" pytest
      - name: Run Sopro contracts without model downloads
        run: >
          python -m pytest -q
          tests/test_soprosynth_engine.py
          tests/test_model_management_api.py
          tests/test_model_management_cli.py
          tests/test_sopro_release_compatibility.py

  exact-released-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned released engine set
        run: |
          python -m pip install --upgrade "pip<26.2" pytest
          python -m pip install -e . \
            "pykokoro==0.10.8" \
            "pipersynth==0.2.5" \
            "pocketsynth[cpu]==0.2.5" \
            "kittensynth[cpu]==0.1.4" \
            "soprosynth[cpu]==0.1.1" \
            "supertonicsynth[cpu]==0.1.2" \
            "inflectsynth[cpu]==0.1.1"
      - name: Run released-set compatibility contracts
        run: python -m pytest -q tests/test_engine_registry.py tests/test_backends.py tests/test_soprosynth_engine.py tests/test_sopro_release_compatibility.py

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lower-bound dependencies
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install \
            "pytest==8.0.0" \
            "numpy==1.24.0" \
            "audiosig==0.1.8" \
            "soundfile==0.12.1" \
            "tomlkit==0.13.3" \
            "tomli==2.0.1" \
            "renderplan==0.2.1" \
            "voicefolio @ git+https://github.com/buchwandler/voicefolio.git@93bea04d210d509b59e8e616f1be1cf1d816a19d" \
            "onnxvoice==0.2.14"
          python -m pip install --no-deps -e .
      - name: Run lower-bound tests
        run: python -m pytest -q

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade "pip<26.2" build twine
          python -m build --outdir "$RUNNER_TEMP/dist"
          python -m twine check "$RUNNER_TEMP"/dist/*
      - name: Verify SCM fallback for an untagged source archive
        run: |
          mkdir -p "$RUNNER_TEMP/voicerender-source-archive" "$RUNNER_TEMP/fallback-dist"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/voicerender-source-archive"
          python -m build --wheel \
            --outdir "$RUNNER_TEMP/fallback-dist" \
            "$RUNNER_TEMP/voicerender-source-archive"
          python - "$RUNNER_TEMP/fallback-dist" <<'PY'
          import sys
          from email import policy
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path(sys.argv[1]).glob("voicerender-*.whl"))
          with ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist() if name.endswith("METADATA")
              )
              metadata = Parser(policy=policy.default).parsestr(
                  archive.read(metadata_name).decode("utf-8")
              )
          assert metadata["Version"] == "0+unknown", metadata["Version"]
          PY
      - name: Verify package contents
        run: |
          python - <<'PY'
          import os
          import tarfile
          from email import policy
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.requirements import Requirement

          artifacts = Path(os.environ["RUNNER_TEMP"]) / "dist"
          wheel = next(artifacts.glob("voicerender-*.whl"))
          sdist = next(artifacts.glob("voicerender-*.tar.gz"))
          expected = {
              "voicerender/py.typed",
              "voicerender/renderplan_render.py",
              "voicerender/book_contract.py",
              "voicerender/book_layout.py",
          }

          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert expected <= names
              metadata_name = next(name for name in names if name.endswith("METADATA"))
              metadata = Parser(policy=policy.default).parsestr(
                  archive.read(metadata_name).decode("utf-8")
              )
              requirements = {
                  Requirement(value).name
                  for value in metadata.get_all("Requires-Dist", [])
              }
              assert {"numpy", "soundfile"} <= requirements

              renderplan_requirement = next(
                  Requirement(value)
                  for value in metadata.get_all("Requires-Dist", [])
                  if Requirement(value).name.lower() == "renderplan"
              )
              assert {">=0.1.2", "<0.2"} <= {
                  str(specifier) for specifier in renderplan_requirement.specifier
              }
              base_requirements = set()
              for value in metadata.get_all("Requires-Dist", []):
                  requirement = Requirement(value)
                  if (
                      requirement.marker is None
                      or requirement.marker.evaluate({"extra": ""})
                  ):
                      base_requirements.add(requirement.name.lower())
              engine_sdks = {
                  "chatterboxsynth",
                  "inflectsynth", "kittensynth", "pykokoro", "pipersynth",
                  "pocketsynth", "soprosynth", "supertonicsynth",
                  "qwen3synth",
              }
              assert not engine_sdks & base_requirements
              assert "utterplan" not in base_requirements
              assert not {"audiocompose", "readio"} & {name.lower() for name in requirements}

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
              assert all(any(name.endswith(resource) for name in names) for resource in expected)
          PY
      - name: Install wheel in clean environment
        run: |
          python -m venv "$RUNNER_TEMP/voicerender-wheel-venv"
          "$RUNNER_TEMP/voicerender-wheel-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/dist/voicerender-*.whl
      - name: Run installed base smoke checks
        working-directory: ${{ runner.temp }}
        run: |
          VENV="$RUNNER_TEMP/voicerender-wheel-venv"
          "$VENV/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import importlib.resources as resources
          import sys

          import voicerender
          import voicerender.book
          from renderplan import RenderPlanSet
          from voicerender import list_engines

          assert metadata.version("voicerender") == voicerender.__version__
          assert resources.files("voicerender").joinpath("py.typed").is_file()
          assert resources.files("voicerender").joinpath("renderplan_render.py").is_file()
          assert resources.files("voicerender").joinpath("book_contract.py").is_file()
          assert resources.files("voicerender").joinpath("book_layout.py").is_file()
          assert RenderPlanSet is not None
          assert {item["id"] for item in list_engines()} == {
              "chatterbox",
              "inflect",
              "kitten",
              "kokoro",
              "piper",
              "pocket",
              "qwen3",
              "sopro",
              "supertonic",
          }
          assert not any(
              name.split(".", 1)[0] in {
                  "chatterboxsynth",
                  "inflectsynth", "kittensynth", "pykokoro", "pipersynth",
                  "pocketsynth", "soprosynth", "supertonicsynth", "utterplan",
                  "qwen3synth",
              }
              for name in sys.modules
          )
          PY
          "$VENV/bin/voicerender" --version
          "$VENV/bin/voicerender" engines list --json
          "$VENV/bin/python" "$GITHUB_WORKSPACE/tests/wheel_smoke.py"
      - name: Smoke-test the installed Piper extra
        working-directory: ${{ runner.temp }}
        run: |
          VENV="$RUNNER_TEMP/voicerender-wheel-venv"
          WHEEL="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name 'voicerender-*.whl' -print -quit)"
          "$VENV/bin/python" -m pip install "${WHEEL}[piper]"
          "$VENV/bin/voicerender" engines inspect piper
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: sphinx-build -W --keep-going -D master_doc=index -b html docs docs/_build/html
