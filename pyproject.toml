[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicerender"
dynamic = ["version"]
description = "Shared RenderPlan preflight and resumable multi-engine speech synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "buchwandler"}]
keywords = ["text-to-speech", "tts", "speech", "voice-cloning", "audio"]
dependencies = [
  "numpy>=1.23",
  "soundfile>=0.12",
  "tomli>=2; python_version < '3.11'",
  "renderplan>=0.1,<0.2",
]

[project.optional-dependencies]
inflect = ["inflectsynth[cpu]>=0.1.1,<0.2"]
kitten = ["kittensynth[cpu]>=0.1.1,<0.2"]
kokoro = ["pykokoro>=0.10.2,<0.11"]
piper = ["pipersynth>=0.2.1,<0.3"]
pocket = ["pocketsynth[cpu]>=0.2.5,<0.3"]
supertonic = ["supertonicsynth[cpu]>=0.1.2,<0.2"]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.12",
  "setuptools-scm>=9.2",
  "twine>=6",
]
[project.scripts]
voicerender = "voicerender.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voicerender*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
voicerender = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0+unknown"
version_file = "voicerender/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
extend-exclude = [
  "02_audiocompose_voicerender_manual_pipeline_implementation_brief.md",
  "03_voicerender_renderplan_preflight_and_execution_brief.md",
]

[tool.mypy]
# Current NumPy stubs use type statements introduced in Python 3.12.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
  "inflectsynth",
  "kittensynth",
  "pipersynth",
  "pocketsynth",
  "pykokoro",
  "soundfile",
  "supertonicsynth",
  "renderplan",
  "renderplan.*",
  "tomli",
  "tomllib",
]
ignore_missing_imports = true
