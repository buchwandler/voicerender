[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicerender"
dynamic = ["version"]
description = "Shared RenderPlan preflight and resumable multi-engine speech synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "buchwandler"}]
keywords = ["text-to-speech", "tts", "speech", "voice-cloning", "audio"]
dependencies = [
  "numpy>=1.23",
  "audiosig>=0.1.8,<0.2",
  "soundfile>=0.12",
  "tomlkit>=0.13",
  "tomli>=2; python_version < '3.11'",
  "renderplan>=0.1.3,<0.2",
  "voicefolio @ git+https://github.com/buchwandler/voicefolio.git@93bea04d210d509b59e8e616f1be1cf1d816a19d",
  "onnxvoice>=0.2.14,<0.3",
]

[project.optional-dependencies]
chatterbox = ["chatterboxsynth[cpu]>=0.1.1,<0.2"]
inflect = ["inflectsynth[cpu]>=0.1.1,<0.2"]
kitten = ["kittensynth[cpu]>=0.1.9,<0.2"]
kokoro = ["pykokoro>=0.10.7,<0.11"]
piper = ["pipersynth>=0.2.5,<0.3"]
pocket = ["pocketsynth[cpu]>=0.2.5,<0.3"]
sopro = ["soprosynth[cpu]>=0.1.0,<0.2"]
supertonic = ["supertonicsynth[cpu]>=0.1.2,<0.2"]
qwen3 = ["qwen3synth[cpu]>=0.1.0,<0.2"]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.12",
  "setuptools-scm>=9.2",
  "twine>=6",
]
[project.scripts]
voicerender = "voicerender.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voicerender*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
voicerender = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0+unknown"
version_file = "voicerender/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
extend-exclude = [
]

[tool.mypy]
# Current NumPy stubs use type statements introduced in Python 3.12.
python_version = "3.12"
strict = true
exclude = ["build/"]

[[tool.mypy.overrides]]
module = [
  "chatterboxsynth",
  "inflectsynth",
  "kittensynth",
  "onnxvoice",
  "pipersynth",
  "pocketsynth",
  "pykokoro",
  "soprosynth",
  "qwen3synth",
  "soundfile",
  "supertonicsynth",
  "renderplan",
  "renderplan.*",
  "tomli",
  "tomllib",
  "voicefolio",
  "voicefolio.*",
]
ignore_missing_imports = true
